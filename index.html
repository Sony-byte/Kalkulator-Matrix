
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Aljabar Linear</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #f4f6fb;
    color: #1e293b;
}

.container {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 260px;
    background: #172554;
    color: white;
    padding: 25px 15px;
    flex-shrink: 0;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    padding: 10px;
    margin-bottom: 35px;
}

.logo span {
    color: #60a5fa;
}

.sidebar h4 {
    font-size: 11px;
    color: #94a3b8;
    margin: 20px 10px 12px;
    letter-spacing: 1px;
}

.menu {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 7px;
    border: none;
    border-radius: 8px;
    color: #cbd5e1;
    background: transparent;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
}

.menu:hover, .menu.active {
    background: #2563eb;
    color: white;
}

.main {
    flex: 1;
    padding: 35px;
    min-width: 0;
}

.header {
    margin-bottom: 30px;
}

.header h1 {
    font-size: 27px;
    margin-bottom: 8px;
}

.header p {
    color: #64748b;
    font-size: 14px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 13px;
    margin-bottom: 22px;
    box-shadow: 0 3px 15px rgba(0,0,0,.04);
}

.card h2 {
    font-size: 19px;
    margin-bottom: 10px;
}

.description {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 22px;
}

label {
    display: block;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 9px;
}

textarea, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #dbe2ee;
    border-radius: 8px;
    outline: none;
    background: #fbfdff;
    font-size: 14px;
    margin-bottom: 18px;
}

textarea {
    resize: vertical;
    min-height: 100px;
    font-family: Consolas, monospace;
    line-height: 1.7;
}

textarea:focus, select:focus {
    border-color: #2563eb;
}

.field {
    margin-bottom: 5px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

button.action {
    padding: 12px 22px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

button.action:hover {
    background: #1d4ed8;
}

button.reset {
    padding: 12px 22px;
    border: 1px solid #cbd5e1;
    background: white;
    color: #475569;
    border-radius: 8px;
    cursor: pointer;
    margin-left: 8px;
}

.result {
    display: none;
}

.result h2 {
    margin-bottom: 15px;
}

.result-box {
    padding: 16px;
    background: #f0f7ff;
    border-left: 4px solid #2563eb;
    border-radius: 7px;
    margin-bottom: 15px;
}

.result pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.8;
}

.step {
    padding: 15px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    margin-bottom: 12px;
}

.step strong {
    display: block;
    margin-bottom: 10px;
    font-size: 13px;
}

.error {
    background: #fef2f2;
    border-left: 4px solid #ef4444;
    padding: 15px;
    color: #b91c1c;
    border-radius: 7px;
    margin-bottom: 15px;
}

.footer {
    text-align: center;
    color: #94a3b8;
    padding: 20px;
    font-size: 12px;
}

@media(max-width: 750px) {
    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        padding: 15px;
    }

    .logo {
        margin-bottom: 10px;
    }

    .sidebar h4 {
        display: none;
    }

    .menu {
        width: auto;
        display: inline-block;
        margin: 3px;
        padding: 10px;
    }

    .main {
        padding: 18px;
    }

    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<aside class="sidebar">

    <div class="logo">ALJABAR<span>LINEAR.</span></div>

    <h4>MENU PERHITUNGAN</h4>

    <button class="menu active" onclick="pilih('obe',this)">
        ▦ Operasi Baris Elementer
    </button>

    <button class="menu" onclick="pilih('spl',this)">
        ∑ Sistem Persamaan Linear
    </button>

    <button class="menu" onclick="pilih('invers',this)">
        ▣ Invers Matriks
    </button>

    <button class="menu" onclick="pilih('cramer',this)">
        ◈ Aturan Cramer
    </button>

    <button class="menu" onclick="pilih('norma',this)">
        ∥ Norma Vektor
    </button>

    <button class="menu" onclick="pilih('jarak',this)">
        ⌖ Jarak Antar Titik
    </button>

</aside>


<main class="main">

    <div class="header">
        <h1 id="judul">Operasi Baris Elementer</h1>
        <p>Kalkulator Aljabar Linear - Perhitungan matematika secara otomatis.</p>
    </div>


    <div class="card">

        <h2 id="subjudul">Kalkulator OBE</h2>

        <p class="description" id="deskripsi">
            Masukkan matriks untuk mendapatkan hasil operasi baris elementer.
        </p>


        <div id="input-matriks" class="field">

            <label>Matriks A</label>

            <textarea id="A"
                placeholder="Contoh:
1 2 3
4 5 6
7 8 9"></textarea>

        </div>


        <div id="input-b" class="field" style="display:none">

            <label>Vektor B (satu angka setiap baris)</label>

            <textarea id="B"
                placeholder="Contoh:
6
15
24"></textarea>

        </div>


        <div id="input-vektor" class="field" style="display:none">

            <label>Masukkan Vektor</label>

            <textarea id="V"
                placeholder="Contoh: 3 4 5"></textarea>

            <label>Jenis Norma</label>

            <select id="norma">
                <option value="L1">Norma L1</option>
                <option value="L2">Norma L2 (Euclidean)</option>
                <option value="Linf">Norma L∞</option>
            </select>

        </div>


        <div id="input-titik" class="grid" style="display:none">

            <div>
                <label>Titik P</label>
                <textarea id="P" placeholder="Contoh: 1 2 3"></textarea>
            </div>

            <div>
                <label>Titik Q</label>
                <textarea id="Q" placeholder="Contoh: 4 6 8"></textarea>
            </div>

        </div>


        <button class="action" onclick="hitung()">
            Hitung Sekarang
        </button>

        <button class="reset" onclick="resetForm()">
            Reset
        </button>

    </div>


    <div class="card result" id="hasil">

        <h2>Hasil Perhitungan</h2>

        <div id="isi-hasil"></div>

    </div>


    <div class="footer">
        Kalkulator Aljabar Linear © 2026
    </div>

</main>
</div>


<script>

let jenis = "obe";

const materi = {
    obe: {
        judul: "Operasi Baris Elementer",
        sub: "Kalkulator OBE",
        deskripsi: "Masukkan matriks untuk mendapatkan bentuk eselon baris tereduksi (RREF)."
    },

    spl: {
        judul: "Sistem Persamaan Linear",
        sub: "Kalkulator SPL",
        deskripsi: "Masukkan matriks koefisien A dan vektor konstanta B."
    },

    invers: {
        judul: "Invers Matriks",
        sub: "Kalkulator Invers Matriks",
        deskripsi: "Menghitung invers matriks persegi menggunakan metode OBE."
    },

    cramer: {
        judul: "Aturan Cramer",
        sub: "Kalkulator Aturan Cramer",
        deskripsi: "Menyelesaikan SPL menggunakan determinan dan aturan Cramer."
    },

    norma: {
        judul: "Norma Vektor",
        sub: "Kalkulator Norma Vektor",
        deskripsi: "Menghitung panjang vektor menggunakan beberapa jenis norma."
    },

    jarak: {
        judul: "Jangkauan Titik",
        sub: "Kalkulator Jarak Antar Titik",
        deskripsi: "Menghitung jarak Euclidean antara dua titik dalam berbagai dimensi."
    }
};


function pilih(value, element) {

    jenis = value;

    document.querySelectorAll(".menu").forEach(btn => {
        btn.classList.remove("active");
    });

    element.classList.add("active");

    document.getElementById("judul").innerText =
        materi[value].judul;

    document.getElementById("subjudul").innerText =
        materi[value].sub;

    document.getElementById("deskripsi").innerText =
        materi[value].deskripsi;

    document.getElementById("input-matriks").style.display =
        ["obe","spl","invers","cramer"].includes(value)
        ? "block" : "none";

    document.getElementById("input-b").style.display =
        ["spl","cramer"].includes(value)
        ? "block" : "none";

    document.getElementById("input-vektor").style.display =
        value === "norma" ? "block" : "none";

    document.getElementById("input-titik").style.display =
        value === "jarak" ? "grid" : "none";

    document.getElementById("hasil").style.display = "none";
}


function parseMatrix(text) {

    const rows = text.trim().split(/\n+/);

    const matrix = rows.map(row =>
        row.trim().split(/[,\s]+/).map(Number)
    );

    if (!matrix.length || matrix.some(row =>
        !row.length || row.some(x => !Number.isFinite(x))
    )) {
        throw new Error("Format matriks tidak valid.");
    }

    if (matrix.some(row => row.length !== matrix[0].length)) {
        throw new Error("Jumlah kolom setiap baris harus sama.");
    }

    return matrix;
}


function parseVector(text) {

    const values = text.trim().split(/[,\s\n]+/).map(Number);

    if (!values.length || values.some(x => !Number.isFinite(x))) {
        throw new Error("Format vektor tidak valid.");
    }

    return values;
}


function ambilData() {

    let data = {jenis: jenis};

    if (["obe","spl","invers","cramer"].includes(jenis)) {

        data.A = parseMatrix(
            document.getElementById("A").value
        );

    }

    if (["spl","cramer"].includes(jenis)) {

        data.b = parseVector(
            document.getElementById("B").value
        );

    }

    if (jenis === "norma") {

        data.v = parseVector(
            document.getElementById("V").value
        );

        data.norma = document.getElementById("norma").value;

    }

    if (jenis === "jarak") {

        data.P = parseVector(
            document.getElementById("P").value
        );

        data.Q = parseVector(
            document.getElementById("Q").value
        );

    }

    return data;
}


function tampilkan(obj, parent) {

    if (obj === null || obj === undefined) return;

    if (typeof obj === "object") {

        if (Array.isArray(obj)) {

            if (obj.length && Array.isArray(obj[0])) {

                const pre = document.createElement("pre");
                pre.textContent = obj.map(row =>
                    "[ " + row.join("    ") + " ]"
                ).join("\n");

                parent.appendChild(pre);

            } else if (obj.length) {

                const pre = document.createElement("pre");
                pre.textContent = JSON.stringify(obj, null, 2);
                parent.appendChild(pre);

            }

            return;
        }

        Object.entries(obj).forEach(([key, value]) => {

            const section = document.createElement("div");
            section.className = "result-box";

            const title = document.createElement("strong");
            title.textContent = key.replaceAll("_", " ").toUpperCase();

            section.appendChild(title);

            if (value && typeof value === "object") {
                tampilkan(value, section);
            } else {
                const pre = document.createElement("pre");
                pre.textContent = String(value);
                section.appendChild(pre);
            }

            parent.appendChild(section);

        });

    } else {

        const pre = document.createElement("pre");
        pre.textContent = String(obj);
        parent.appendChild(pre);

    }

}


async function hitung() {

    const output = document.getElementById("isi-hasil");
    const box = document.getElementById("hasil");

    output.replaceChildren();
    box.style.display = "block";

    try {

        const data = ambilData();

        const response = await fetch("/hitung", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.error || "Perhitungan gagal.");
        }

        const h = result.hasil;

        // Hasil utama
        if (h.hasil !== undefined) {

            const title = document.createElement("h3");
            title.textContent = "HASIL AKHIR";
            output.appendChild(title);

            const section = document.createElement("div");
            section.className = "result-box";
            tampilkan(h.hasil, section);
            output.appendChild(section);

        }

        // Detail hasil lain
        Object.entries(h).forEach(([key, value]) => {

            if (key === "hasil" || key === "langkah") return;

            const section = document.createElement("div");
            section.className = "result-box";

            const title = document.createElement("strong");
            title.textContent = key.replaceAll("_", " ").toUpperCase();

            section.appendChild(title);
            tampilkan(value, section);

            output.appendChild(section);

        });


        // Langkah pengerjaan
        if (h.langkah) {

            const heading = document.createElement("h3");
            heading.textContent = "LANGKAH PENGERJAAN";
            heading.style.margin = "20px 0";
            output.appendChild(heading);

            h.langkah.forEach((step, index) => {

                const div = document.createElement("div");
                div.className = "step";

                const title = document.createElement("strong");
                title.textContent =
                    "Langkah " + (index + 1) + ": " + step.description;

                div.appendChild(title);

                const pre = document.createElement("pre");

                if (step.matrix) {
                    pre.textContent = step.matrix.map(row =>
                        "[ " + row.join("    ") + " ]"
                    ).join("\n");
                } else {
                    pre.textContent = JSON.stringify(step, null, 2);
                }

                div.appendChild(pre);
                output.appendChild(div);

            });

        }

        if (!h.hasil && h.jenis) {
            const info = document.createElement("div");
            info.className = "result-box";
            info.textContent = h.jenis;
            output.prepend(info);
        }

    } catch (error) {

        const div = document.createElement("div");
        div.className = "error";
        div.textContent = error.message;
        output.appendChild(div);

    }

    box.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


function resetForm() {

    document.querySelectorAll("textarea").forEach(el => {
        el.value = "";
    });

    document.getElementById("hasil").style.display = "none";

}

</script>

</body>
</html>
