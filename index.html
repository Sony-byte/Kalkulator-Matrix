<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Aljabar Linear & Geometri</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigasi -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-badge">Σ</span>
        <div>
          <h1>Aljabar & Geometri</h1>
          <p>Kalkulator + Langkah Hitung</p>
        </div>
      </div>

      <nav class="menu-list" id="menuList">
        <button class="menu-btn active" data-mode="obe">1. Aturan OBE (RREF)</button>
        <button class="menu-btn" data-mode="spl">2. Resolusi SPL (Ax = b)</button>
        <button class="menu-btn" data-mode="invers">3. Matriks Invers</button>
        <button class="menu-btn" data-mode="cramer">4. Aturan Cramer</button>
        <button class="menu-btn" data-mode="norma">5. Norma Vektor</button>
        <button class="menu-btn" data-mode="titik">6. Jangkauan Titik</button>
        <button class="menu-btn" data-mode="operasi">7. Operasi Matriks</button>
      </nav>
    </aside>

    <!-- Konten Utama -->
    <main class="main-content">
      <header class="topbar">
        <div>
          <h2 id="modeTitle">1. Aturan OBE (RREF)</h2>
          <p id="modeDesc">Reduksi matriks ke bentuk Eselon Baris Tereduksi langkah demi langkah.</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-secondary" id="btnContoh">Isi Contoh</button>
          <button type="button" class="btn btn-ghost" id="btnReset">Reset</button>
        </div>
      </header>

      <section class="card input-card">
        <div id="dynamicControls" class="controls-bar"></div>
        <div id="inputWorkspace" class="workspace"></div>

        <div class="submit-row">
          <button type="button" class="btn btn-primary" id="btnHitung">
            Hitung & Tampilkan Proses
          </button>
        </div>
      </section>

      <section class="card output-card">
        <h3>Proses & Hasil Perhitungan</h3>
        <div id="outputContainer" class="output-area">
          <p class="placeholder-text">
            Masukkan angka pada form di atas, lalu klik <strong>Hitung & Tampilkan Proses</strong>.
          </p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
